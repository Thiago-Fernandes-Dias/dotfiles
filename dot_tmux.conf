# Reload hotkey
unbind r
bind r source-file ~/.tmux.conf

# New window on the current path
bind c new-window -c "#{pane_current_path}"

# Kill windows and panes without confirmation
bind-key & kill-window
bind-key x kill-pane

# Ativa o modo de vi para navegação no histórico (Ctrl+b + [)
setw -g mode-keys vi

# Atalhos para copiar texto idênticos aos do Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Atalhos para mover o cursor entre os painéis com h, j, k, l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fix colors
set -g default-terminal "tmux-256color"
set-option -ga terminal-o

# Change prefix, for comfort
set -g prefix2 C-s

# Scrolling
setw -g mouse on

set -g @continuum-restore 'on'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
